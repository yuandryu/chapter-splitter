services:
  - type: web
    name: chapter-splitter-api
    runtime: python
    rootDir: cloud
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server_r2:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: API_TOKEN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "1073741824"
      - key: UPLOAD_PART_SIZE
        value: "10485760"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
